# Render Blueprint: https://render.com/docs/blueprint-spec
# Backend runs in Docker (needs Chromium); frontend is a plain Node service.
services:
  - type: web
    name: anytask-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Chromium needs real memory: 512MB plans run out with more than one browser.
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANYTASK_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_CONCURRENT_RUNS
        value: "2"
      - key: SCREENSHOT_STORAGE
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: TEST_EMAIL_BASE
        sync: false
      - key: TEST_PHONE
        sync: false

  - type: web
    name: anytask-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # Baked in at build time, e.g. https://anytask-backend.onrender.com/api
      - key: NEXT_PUBLIC_API_URL
        sync: false
