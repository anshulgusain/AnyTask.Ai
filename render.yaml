# Render Blueprint for the backend: https://render.com/docs/blueprint-spec
# The frontend is deployed separately on Vercel (root directory: frontend).
services:
  - type: web
    name: anytask-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Free: 512 MB and sleeps after 15 idle minutes. One Chromium at a time fits;
    # move to "standard" (2 GB) and raise MAX_CONCURRENT_RUNS for parallel runs.
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANYTASK_API_KEY
        sync: false
      # The Vercel URL of the frontend, e.g. https://anytask.vercel.app
      - key: CORS_ORIGIN
        sync: false
      - key: MAX_CONCURRENT_RUNS
        value: "1"
      - key: AGENT_MAX_GOALS
        value: "3"
      # Local disk is wiped on every deploy; Cloudinary keeps screenshots (free, no card).
      - key: SCREENSHOT_STORAGE
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
